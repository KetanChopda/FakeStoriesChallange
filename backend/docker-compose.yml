# Local stack: the API and Mailpit, a mail catcher whose web UI shows every email sent.
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SALES_INBOX: ${SALES_INBOX:-sales@example.com}
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped
